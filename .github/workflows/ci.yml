name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Même ligne de Node qu'en local : .nvmrc fait foi, pas un numéro recopié ici.
      # Il ne nomme que la majeure : `check-latest` prend le dernier correctif publié
      # plutôt que celui en cache sur le runner, qui peut dater d'avant un bulletin
      # de sécurité.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - run: npm ci

      - run: npm run verify
